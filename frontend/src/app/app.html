<div class="flex items-center justify-between mb-6">
  <h1 class="text-3xl font-bold">Flashcards</h1>

  <button
    (click)="loadFlashcards()"
    class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-800"
  >
    Refresh
  </button>
</div>

<div class="grid gap-4">
  @for (flashcard of flashcards(); track flashcard.id) {
  <div class="border rounded-lg p-4 shadow-sm">

    @if (editingId === flashcard.id) {
    <div class="space-y-3">
      <input
        type="text"
        [(ngModel)]="editFlashcard.question"
        class="w-full border rounded-lg px-4 py-2"
      >

      <input
        type="text"
        [(ngModel)]="editFlashcard.answer"
        class="w-full border rounded-lg px-4 py-2"
      >

      <input
        type="text"
        [(ngModel)]="editFlashcard.category"
        class="w-full border rounded-lg px-4 py-2"
      >

      <div class="flex gap-2">
        <button
          (click)="saveEdit()"
          class="bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700"
        >
          Save
        </button>

        <button
          (click)="editingId = null"
          class="bg-gray-500 text-white px-3 py-2 rounded-lg hover:bg-gray-600"
        >
          Cancel
        </button>
      </div>
    </div>
    } @else {
    <h2 class="text-xl font-semibold">
      {{ flashcard.question }}
    </h2>

    <p class="mt-2">{{ flashcard.answer }}</p>

    <p class="text-sm text-gray-500 mt-2">
      Category: {{ flashcard.category }}
    </p>

    <div class="flex gap-2 mt-4">
      <button
        (click)="startEdit(flashcard)"
        class="bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-700"
      >
        Edit
      </button>

      <button
        (click)="deleteFlashcard(flashcard.id)"
        class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700"
      >
        Delete
      </button>
    </div>
    }
  </div>
  }
</div>

<div class="max-w-xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">Create Flashcard</h2>

  <div class="space-y-4">
    <input
      type="text"
      placeholder="Question"
      [(ngModel)]="newFlashcard.question"
      class="w-full border rounded-lg px-4 py-2"
    >

    <input
      type="text"
      placeholder="Answer"
      [(ngModel)]="newFlashcard.answer"
      class="w-full border rounded-lg px-4 py-2"
    >

    <input
      type="text"
      placeholder="Category"
      [(ngModel)]="newFlashcard.category"
      class="w-full border rounded-lg px-4 py-2"
    >

    <button
      (click)="createFlashcard()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"
    >
      Create Flashcard
    </button>
  </div>
</div>
