<header class="sticky top-0 z-10 bg-white border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-6 h-16 flex items-center gap-3">
    @if (showBack) {
    <button
      (click)="goBack()"
      class="flex items-center justify-center w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 hover:text-indigo-600 transition-colors"
      aria-label="Back to categories"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    }
    <a routerLink="/" class="text-lg font-semibold text-gray-800">
      <span class="text-indigo-600">Flash</span>Card
    </a>
  </div>
</header>
